name: Update Problem Counter

on:
  push:
    branches:
      - main
    paths:
      - 'Topics/**'
      - '.github/workflows/update-counter.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count unique problems and update README
        id: update_readme
        run: |
          python .github/scripts/update_readme.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Auto-update README and problem counter"
          file_pattern: README.md
